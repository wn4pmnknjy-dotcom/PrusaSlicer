name: Build Windows package (fork)

# Self-contained Windows build that does not depend on Prusa's private
# actions repository. Produces a zip with prusa-slicer.exe as an artifact.

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps/build/destdir
          key: win-deps-${{ hashFiles('deps/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmake -S deps -B deps/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DPrusaSlicer_deps_PACKAGE_EXCLUDES="OCCT|sentry"
          cmake --build deps/build

      - name: Save dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build/destdir
          key: win-deps-${{ hashFiles('deps/**') }}

      - name: Build PrusaSlicer
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSLIC3R_BUILD_TESTS=OFF -DSLIC3R_ENABLE_FORMAT_STEP=OFF -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%/deps/build/destdir/usr/local"
          cmake --build build

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --prefix dist
          Get-ChildItem -Recurse build -Include *.exe,*.dll | Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Copy-Item -Destination dist -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-windows-x64
          path: dist
          retention-days: 30
