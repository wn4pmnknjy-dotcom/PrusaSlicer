# Starting exposures for castable wax resin on mono LCD screens. Every resin
# and screen differs: calibrate with a test print and adjust.
id: Generic Castable Wax
kind: sla_material
values:
  compatible_printers_condition: printer_notes=~/.*PRINTER_VENDOR_JEWELRY_CASTABLE.*/
  material_vendor: Generic
  material_type: Castable
  material_colour: '#C0392B'
  material_correction: [1.0, 1.0]
  material_print_speed: slow
  faded_layers: 6
  use_tilt: [0, 0]
